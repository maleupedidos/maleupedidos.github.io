# EL ROBOT DE PRUEBAS, TODAS LAS NOCHES (4/11/2026).
# Recorre el ERP publicado con el usuario robot (entra por la base, modo ensayo: nada sale a Apps Script) y deja el
# resultado en la base (`robot_resultado`). A las 8:00 el cartero de la base lo manda al grupo «Maleu - Resumenes».
# Acá NO hay token de Telegram ni de la base: solo el usuario y PIN del robot (secrets ROBOT_USUARIO y ROBOT_PIN).
#
# (11/11/2026, Organizador por Tadeo) YA NO CORRE EN CADA PUSH. Corría en cada publicación, estuvo en rojo en todas, y a
# Tadeo le llegaba un mail de GitHub por cada una. El de antes de publicar ya existe: `deploy.sh` corre el robot sobre lo
# que se va a publicar (paso 3c2) y no publica si falla. Acá queda el nocturno y el manual (workflow_dispatch).
# Si algo falla, el último paso avisa con UNA línea al Telegram «Maleu · Resúmenes» (migración 654), no por mail.
name: robot nocturno
on:
  schedule:
    - cron: '30 6 * * *'   # 03:30 en Argentina (GitHub lo larga cuando quiere: el robot no corre fuera de 1–8 h)
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: robot
  cancel-in-progress: false
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Robot contra app.maleu.com.ar
        id: robot
        env:
          ROBOT_USUARIO: ${{ secrets.ROBOT_USUARIO }}
          ROBOT_PIN: ${{ secrets.ROBOT_PIN }}
          ROBOT_PIN_REP: ${{ secrets.ROBOT_PIN_REP }}
          CHROME_BIN: /usr/bin/google-chrome
        run: node _tools/robot/robot.js
      - name: Sin Apps Script (todas las tabs con script.google.com cortado)
        id: sinapps
        if: always()
        env:
          ROBOT_USUARIO: ${{ secrets.ROBOT_USUARIO }}
          ROBOT_PIN: ${{ secrets.ROBOT_PIN }}
          CHROME_BIN: /usr/bin/google-chrome
        run: node _tools/robot/sin_apps.js
      - name: Checkout PRUEBA en la tienda real (maleu.com.ar)
        id: tienda
        if: always()
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node _tools/robot/tienda_checkout.js
      - name: La sesión vieja se cierra (reentrada con PIN, con y sin cola de Ruta)
        id: reentrada
        if: always()
        env:
          ROBOT_USUARIO: ${{ secrets.ROBOT_USUARIO }}
          ROBOT_PIN: ${{ secrets.ROBOT_PIN }}
          CHROME_BIN: /usr/bin/google-chrome
        run: node _tools/robot/reentrada.js
      - name: El representante entra por la pantalla de login sin Apps Script (y su portal no lo usa)
        id: rep
        if: always()
        env:
          ROBOT_USUARIO: ${{ secrets.ROBOT_USUARIO }}
          ROBOT_PIN: ${{ secrets.ROBOT_PIN }}
          ROBOT_PIN_REP: ${{ secrets.ROBOT_PIN_REP }}
          SIN_APPS_ROL: rep
          CHROME_BIN: /usr/bin/google-chrome
        run: node _tools/robot/sin_apps.js
      - name: Si algo falló, una línea al Telegram de resúmenes
        if: failure()
        env:
          ROBOT_USUARIO: ${{ secrets.ROBOT_USUARIO }}
          ROBOT_PIN: ${{ secrets.ROBOT_PIN }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FALLO: >-
            Falló: ${{ steps.robot.outcome == 'failure' && 'el recorrido del ERP · ' || '' }}${{ steps.sinapps.outcome == 'failure' && 'pantallas sin Apps Script · ' || '' }}${{ steps.tienda.outcome == 'failure' && 'compra de prueba en la tienda · ' || '' }}${{ steps.reentrada.outcome == 'failure' && 'volver a entrar con PIN · ' || '' }}${{ steps.rep.outcome == 'failure' && 'el portal del representante · ' || '' }}el detalle está en GitHub.
        run: |
          export VERSION=$(grep -o "maleu-panel-v[0-9]*" sw-panel.js | head -1 | sed 's/maleu-panel-//')
          node _tools/robot/avisar_falla.js
