# EL ROBOT DE PRUEBAS, TODAS LAS NOCHES (4/11/2026) — Y EN CADA PUSH A MAIN (el CI, 4/11/2026, plan de Bauti Coll).
# Recorre el ERP publicado con el usuario robot (entra por la base, modo ensayo: nada sale a Apps Script) y deja el
# resultado en la base (`robot_resultado`). A las 8:00 el cartero de la base lo manda al grupo «Maleu - Resumenes».
# Acá NO hay token de Telegram ni de la base: solo el usuario y PIN del robot (secrets ROBOT_USUARIO y ROBOT_PIN).
# En un push, el push ES la publicación (GitHub Pages): el robot espera a que app.maleu.com.ar sirva la versión del
# commit (el CN de sw-panel.js) y recién ahí prueba. Si un paso falla, el run sale en rojo. Uno a la vez: dos robots
# juntos se pisan la limpieza.
name: robot nocturno
on:
  schedule:
    - cron: '30 6 * * *'   # 03:30 en Argentina (GitHub lo larga cuando quiere: el robot no corre fuera de 1–8 h)
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: robot
  cancel-in-progress: false
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Esperar a que Pages sirva este commit
        if: github.event_name == 'push'
        run: |
          quiero=$(grep -o "maleu-panel-v[0-9]*" sw-panel.js | head -1)
          echo "versión del commit: $quiero"
          for i in $(seq 1 40); do
            hay=$(curl -s "https://app.maleu.com.ar/sw-panel.js?_=$(date +%s)" | grep -o "maleu-panel-v[0-9]*" | head -1 || true)
            [ "$hay" = "$quiero" ] && { echo "publicada: $hay"; exit 0; }
            sleep 15
          done
          echo "::error::a los 10 min app.maleu.com.ar sigue sirviendo $hay y no $quiero"; exit 1
      - name: Robot contra app.maleu.com.ar
        env:
          ROBOT_USUARIO: ${{ secrets.ROBOT_USUARIO }}
          ROBOT_PIN: ${{ secrets.ROBOT_PIN }}
          ROBOT_PIN_REP: ${{ secrets.ROBOT_PIN_REP }}
          CHROME_BIN: /usr/bin/google-chrome
        run: node _tools/robot/robot.js
